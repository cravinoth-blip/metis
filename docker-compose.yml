version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-to-a-long-random-string-32chars}
      - DATABASE_URL=sqlite:////app/data/metis.db
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
      - STATIC_DIR=/app/frontend/dist
    volumes:
      - metis_data:/app/data
    ports:
      - "80:8000"
    restart: unless-stopped

volumes:
  metis_data:
