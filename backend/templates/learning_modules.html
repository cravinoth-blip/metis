{% for m in modules %}
{% set done = m.order in completed_indices %}
<div class="module-item"
     style="display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer"
     hx-get="/api/learnings/ui/modules/{{ m.id }}?learning_id={{ learning_id }}"
     hx-target="#modal-container"
     hx-swap="innerHTML">
  <span style="font-size:16px">{{ '✅' if done else '📄' }}</span>
  <div style="flex:1">
    <div style="font-size:14px;font-weight:500;{{ 'color:var(--text-secondary)' if done else '' }}">{{ m.title }}</div>
    <div class="text-xs text-secondary">{{ m.duration_min or 0 }} min</div>
  </div>
  <span style="font-size:12px;color:var(--primary)">Open &#8594;</span>
</div>
{% else %}
<div style="padding:16px;color:var(--text-secondary);font-size:14px;text-align:center">No modules yet.</div>
{% endfor %}
