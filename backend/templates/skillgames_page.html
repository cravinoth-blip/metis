<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Games &mdash; Metis</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <style>
    #modal-container .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    #modal-container .modal {
      background: #fff; border-radius: 12px; padding: 24px;
      width: 540px; max-width: 95vw; max-height: 90vh; overflow-y: auto;
      position: relative;
    }
    .modal-close {
      position: absolute; top: 12px; right: 12px;
      background: none; border: none; font-size: 1.1rem; cursor: pointer;
      color: var(--text-secondary, #6b7280);
    }
    #toast-container {
      position: fixed; top: 20px; right: 20px; z-index: 9999;
      display: flex; flex-direction: column; gap: 8px;
    }
    .toast { padding: 10px 18px; border-radius: 8px; font-size: 0.9rem; font-weight: 500; animation: fadein 0.2s; }
    .toast-success { background: #dcfce7; color: #166534; }
    .toast-error   { background: #fee2e2; color: #991b1b; }
    .toast-info    { background: #dbeafe; color: #1e40af; }
    @keyframes fadein { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; } }
  </style>
</head>
<body>
  <div id="toast-container"></div>

  <div id="app">
    {% include 'sidebar.html' %}

    <div id="main-wrapper">
      {% set page_title = 'Skill Games' %}
      {% include 'topbar.html' %}

      <main id="content" style="overflow-y:auto">
        <div id="skillgames-container"
             hx-get="/api/quiz/ui/skillgames"
             hx-trigger="load"
             hx-swap="outerHTML">
          <div class="loading" style="padding:24px">Loading&hellip;</div>
        </div>
      </main>
    </div>
  </div>

  <div id="modal-container"></div>

  <script>
    const token = localStorage.getItem('metis_token');
    const user  = JSON.parse(localStorage.getItem('metis_user') || '{}');
    if (!token) { location.href = '/login'; }

    document.getElementById('sidebar-avatar').textContent = user.avatar_initials || '??';
    document.getElementById('topbar-avatar').textContent  = user.avatar_initials || '??';
    document.getElementById('sidebar-name').textContent   = user.full_name || user.username || '—';
    document.getElementById('sidebar-xp').textContent     = `${user.xp ?? 0} XP · Lv ${user.level ?? 0}`;
    document.getElementById('topbar-xp').textContent      = `⚡ ${user.xp ?? 0} XP`;

    if (user.is_admin) document.getElementById('admin-link').classList.remove('hidden');

    document.getElementById('admin-logout-btn').addEventListener('click', () => {
      localStorage.removeItem('metis_token');
      localStorage.removeItem('metis_user');
      location.href = '/login';
    });

    document.body.addEventListener('htmx:configRequest', evt => {
      evt.detail.headers['Authorization'] = `Bearer ${token}`;
    });

    // â”€â”€ Helpers â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function showToast(msg, type = 'info') {
      const el = document.createElement('div');
      el.className = `toast toast-${type}`;
      el.textContent = msg;
      document.getElementById('toast-container').appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }

    function refreshShell() {
      const u = JSON.parse(localStorage.getItem('metis_user') || '{}');
      document.getElementById('sidebar-xp').textContent = `${u.xp ?? 0} XP · Lv ${u.level ?? 0}`;
      document.getElementById('topbar-xp').textContent  = `⚡ ${u.xp ?? 0} XP`;
    }

    function openModal(html) {
      document.getElementById('modal-container').innerHTML =
        `<div class="modal-overlay"><div class="modal">${html}</div></div>`;
      document.querySelector('#modal-container .modal-overlay').addEventListener('click', e => {
        if (e.target.classList.contains('modal-overlay'))
          document.getElementById('modal-container').innerHTML = '';
      });
    }

    function closeModal() { document.getElementById('modal-container').innerHTML = ''; }

    async function apiFetch(method, path, body) {
      const res = await fetch('/api' + path, {
        method,
        headers: {
          'Authorization': `Bearer ${token}`,
          ...(body ? { 'Content-Type': 'application/json' } : {}),
        },
        ...(body ? { body: JSON.stringify(body) } : {}),
      });
      if (!res.ok) { const t = await res.text(); throw new Error(t); }
      return res.json();
    }

    // â”€â”€ Quiz modal â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    async function openQuiz(quizId) {
      openModal(`<div class="loading" style="padding:20px;text-align:center">Loading quiz&hellip;</div>`);

      let detail;
      try { detail = await apiFetch('GET', `/quiz/${quizId}`); }
      catch (e) { showToast(e.message, 'error'); closeModal(); return; }

      const questions = detail.questions ?? [];
      let qi = 0, answers = [], revealed = false;

      function renderQuestion() {
        const q = questions[qi];
        if (!q) { renderResults(); return; }
        document.querySelector('#modal-container .modal').innerHTML = `
          <button class="modal-close" onclick="closeModal()">&#10005;</button>
          <div class="text-sm text-secondary" style="margin-bottom:12px">Question ${qi + 1} of ${questions.length}</div>
          <div style="font-weight:600;font-size:16px;margin-bottom:20px">${q.question}</div>
          <div id="options">
            ${(q.options ?? []).map((opt, i) => `<div class="quiz-option" data-idx="${i}">${opt}</div>`).join('')}
          </div>
          <div id="feedback" style="margin-top:14px;font-size:14px"></div>
          <div style="margin-top:20px;text-align:right">
            <button id="next-btn" class="btn btn-primary" disabled>
              ${qi === questions.length - 1 ? 'Finish' : 'Next'}
            </button>
          </div>`;

        document.querySelector('#options').addEventListener('click', e => {
          const opt = e.target.closest('.quiz-option');
          if (!opt || revealed) return;
          revealed = true;
          const selected = parseInt(opt.dataset.idx);
          const correct  = q.correct_index ?? 0;
          answers.push({ selected, correct });

          document.querySelectorAll('.quiz-option').forEach((o, i) => {
            o.classList.add('revealed');
            if (i === correct) o.classList.add('correct');
            else if (i === selected) o.classList.add('wrong');
          });

          document.getElementById('feedback').innerHTML = selected === correct
            ? `<span style="color:var(--success)">&#10003; Correct!</span> ${q.explanation ?? ''}`
            : `<span style="color:var(--danger)">&#10007; Incorrect.</span> ${q.explanation ?? ''}`;

          document.getElementById('next-btn').disabled = false;
        });

        document.getElementById('next-btn').addEventListener('click', () => {
          if (!revealed) return;
          qi++; revealed = false;
          renderQuestion();
        });
      }

      async function renderResults() {
        const correct = answers.filter(a => a.selected === a.correct).length;
        const score   = Math.round((correct / questions.length) * 100);
        document.querySelector('#modal-container .modal').innerHTML = `
          <div style="text-align:center;padding:20px 0">
            <div style="font-size:48px;margin-bottom:12px">${score >= 70 ? '&#127942;' : '&#128218;'}</div>
            <h2 style="margin-bottom:8px">${score >= 70 ? 'Great work!' : 'Keep practising!'}</h2>
            <p class="text-secondary" style="margin-bottom:20px">${correct} / ${questions.length} correct &middot; ${score}%</p>
            <div id="xp-display" style="font-size:24px;font-weight:700;color:var(--primary,#6366f1);margin-bottom:24px"></div>
            <button class="btn btn-primary" onclick="closeModal()">Done</button>
          </div>`;

        try {
          const res = await apiFetch('POST', `/quiz/${quizId}/submit`, { answers: answers.map(a => a.selected) });
          const xpEarned = res.xp_earned ?? 0;

          // Animate XP counter
          const xpEl = document.getElementById('xp-display');
          let n = 0;
          const step = Math.ceil(xpEarned / 20) || 1;
          const timer = setInterval(() => {
            n = Math.min(n + step, xpEarned);
            xpEl.textContent = `+${n} XP`;
            if (n >= xpEarned) clearInterval(timer);
          }, 50);

          // Update sidebar/topbar immediately from the submit response
          const u = JSON.parse(localStorage.getItem('metis_user') || '{}');
          u.xp    = res.new_xp   ?? u.xp;
          u.level = res.new_level ?? u.level;
          localStorage.setItem('metis_user', JSON.stringify(u));
          refreshShell();

          showToast(
            res.passed
              ? `Quiz complete! +${xpEarned} XP earned`
              : `Quiz done! +${xpEarned} XP — keep practising!`,
            res.passed ? 'success' : 'info'
          );
        } catch (e) { showToast(e.message, 'error'); }
      }

      renderQuestion();
    }

    // â”€â”€ Set up handlers after HTMX loads the quiz grid â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    document.body.addEventListener('htmx:afterSwap', () => {
      // Filter pills
      document.querySelectorAll('#cat-pills .pill').forEach(pill => {
        pill.addEventListener('click', () => {
          document.querySelectorAll('#cat-pills .pill').forEach(p => p.classList.remove('active', 'pill-active'));
          pill.classList.add('active', 'pill-active');
          const cat = pill.dataset.cat;
          document.querySelectorAll('.quiz-card').forEach(card => {
            card.style.display = (cat === 'All' || card.dataset.category === cat) ? '' : 'none';
          });
        });
      });

      // Quiz card clicks
      document.querySelectorAll('.quiz-card:not(.locked)').forEach(card => {
        card.addEventListener('click', () => openQuiz(card.dataset.id));
      });
    });

    document.body.addEventListener('htmx:responseError', () => showToast('Failed to load quizzes.', 'error'));
  </script>
</body>
</html>
