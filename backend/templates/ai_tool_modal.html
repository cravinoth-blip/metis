<div class="modal-overlay">
  <div class="modal">
    <button class="modal-close" onclick="document.getElementById('modal-container').innerHTML=''">&#10005;</button>
    <h3 style="margin-bottom:16px">{{ 'Edit' if tool else 'New' }} AI Tool</h3>

    {% if tool %}
    <form hx-put="/api/admin/ui/ai-tools/{{ tool.id }}" hx-target="#ai-tools-tab-content" hx-swap="outerHTML">
    {% else %}
    <form hx-post="/api/admin/ui/ai-tools" hx-target="#ai-tools-tab-content" hx-swap="outerHTML">
    {% endif %}

      <div class="form-group">
        <label class="form-label">Name *</label>
        <input name="name" required class="form-input" value="{{ tool.name if tool else '' }}">
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-input" rows="3">{{ tool.description if tool else '' }}</textarea>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group">
          <label class="form-label">Category</label>
          <input name="category" class="form-input" placeholder="e.g. Research" value="{{ tool.category if tool else '' }}">
        </div>
        <div class="form-group">
          <label class="form-label">Provider</label>
          <input name="provider" class="form-input" placeholder="e.g. Anthropic" value="{{ tool.provider if tool else '' }}">
        </div>
        <div class="form-group">
          <label class="form-label">Emoji logo</label>
          <input name="emoji_logo" class="form-input" placeholder="&#129302;" value="{{ tool.emoji_logo if tool else '' }}">
        </div>
        <div class="form-group">
          <label class="form-label">URL</label>
          <input name="url" class="form-input" placeholder="https://&#8230;" value="{{ tool.url if tool else '' }}">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Tags (comma-separated)</label>
        <input name="tags" class="form-input" placeholder="Writing, Research, Code" value="{{ tool.tags if tool else '' }}">
      </div>
      <div class="form-group" style="display:flex;align-items:center;gap:10px;margin-top:8px">
        <input type="checkbox" name="is_enterprise" value="true" id="at-enterprise" {% if tool and tool.is_enterprise %}checked{% endif %} style="width:auto">
        <label for="at-enterprise" class="form-label" style="margin:0">Enterprise tool</label>
      </div>
      <div style="text-align:right;margin-top:16px">
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>
