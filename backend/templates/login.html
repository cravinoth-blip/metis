<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metis — Sign in</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">M</div>
      <div style="font-size:22px;font-weight:700;margin-bottom:4px">Metis</div>
      <div class="text-secondary text-sm">Gamified AI Learning Platform</div>
    </div>

    <div id="form-login">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input id="login-email" class="form-input" type="email" placeholder="you@company.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input id="login-password" class="form-input" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <div id="login-error" class="error-msg hidden"></div>
      <button id="login-btn" class="btn btn-primary w-full" style="margin-top:8px">Sign in</button>
      <button id="demo-btn" class="btn btn-secondary w-full" style="margin-top:8px">Use demo account</button>
      <p class="text-sm text-secondary" style="text-align:center;margin-top:16px">
        No account? <a href="#" id="show-register" style="color:var(--accent)">Register</a>
      </p>
    </div>

    <div id="form-register" class="hidden">
      <div class="form-group">
        <label class="form-label">Full name</label>
        <input id="reg-name" class="form-input" type="text" placeholder="Jane Smith">
      </div>
      <div class="form-group">
        <label class="form-label">Username</label>
        <input id="reg-username" class="form-input" type="text" placeholder="janesmith">
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input id="reg-email" class="form-input" type="email" placeholder="you@company.com">
      </div>
      <div class="form-group">
        <label class="form-label">Department</label>
        <input id="reg-dept" class="form-input" type="text" placeholder="Engineering">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input id="reg-password" class="form-input" type="password" placeholder="••••••••">
      </div>
      <div id="reg-error" class="error-msg hidden"></div>
      <button id="reg-btn" class="btn btn-primary w-full" style="margin-top:8px">Create account</button>
      <p class="text-sm text-secondary" style="text-align:center;margin-top:16px">
        Already have an account? <a href="#" id="show-login" style="color:var(--accent)">Sign in</a>
      </p>
    </div>
  </div>

  <script type="module">
    const $ = id => document.getElementById(id);

    $('show-register').addEventListener('click', e => {
      e.preventDefault();
      $('form-login').classList.add('hidden');
      $('form-register').classList.remove('hidden');
    });

    $('show-login').addEventListener('click', e => {
      e.preventDefault();
      $('form-register').classList.add('hidden');
      $('form-login').classList.remove('hidden');
    });

    async function saveAndRedirect(token) {
      localStorage.setItem('metis_token', token);
      const res = await fetch('/api/auth/me', {
        headers: { Authorization: `Bearer ${token}` }
      });
      if (res.ok) localStorage.setItem('metis_user', JSON.stringify(await res.json()));
      location.href = '/dashboard';
    }

    function showError(id, msg) {
      const el = $(id);
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    $('login-btn').addEventListener('click', async () => {
      $('login-error').classList.add('hidden');
      const btn = $('login-btn');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: $('login-email').value, password: $('login-password').value })
        });
        const data = await res.json();
        if (!res.ok) { showError('login-error', data.detail || 'Login failed'); return; }
        await saveAndRedirect(data.access_token);
      } catch (e) {
        showError('login-error', 'Network error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });

    $('demo-btn').addEventListener('click', async () => {
      $('login-email').value = 'admin@metis.ai';
      $('login-password').value = 'MetisAdmin2024!';
      $('login-btn').click();
    });

    $('reg-btn').addEventListener('click', async () => {
      $('reg-error').classList.add('hidden');
      const btn = $('reg-btn');
      btn.disabled = true;
      btn.textContent = 'Creating…';
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            full_name: $('reg-name').value,
            username: $('reg-username').value,
            email: $('reg-email').value,
            department: $('reg-dept').value,
            password: $('reg-password').value,
          })
        });
        const data = await res.json();
        if (!res.ok) { showError('reg-error', data.detail || 'Registration failed'); return; }
        await saveAndRedirect(data.access_token);
      } catch (e) {
        showError('reg-error', 'Network error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create account';
      }
    });

    // Auto-submit on Enter
    ['login-email', 'login-password'].forEach(id => {
      $(id).addEventListener('keydown', e => { if (e.key === 'Enter') $('login-btn').click(); });
    });

    // If already logged in, redirect
    if (localStorage.getItem('metis_token')) location.href = '/dashboard';
  </script>
</body>
</html>
