<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quill + FastAPI</title>
    <!-- Use Quill 2.0 for better features -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        #editor-container { height: 300px; margin-bottom: 20px; }
        
        /* Button Styles */
        .btn { padding: 10px 15px; font-size: 16px; cursor: pointer; border: none; border-radius: 4px; margin-right: 10px; }
        #save-btn { background: #007bff; color: white; }
        #save-btn:hover { background: #0056b3; }
        #preview-btn { background: #28a745; color: white; }
        #preview-btn:hover { background: #218838; }

        /* Modal Styles */
        .modal {
            display: none; /* Hidden by default */
            position: fixed; 
            z-index: 1000; 
            left: 0; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            overflow: auto; 
            background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent background */
        }
        .modal-content {
            background-color: #fefefe;
            margin: 10% auto; /* 10% from the top and centered */
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 800px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .close-btn {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close-btn:hover,
        .close-btn:focus {
            color: black;
            text-decoration: none;
        }
        
        /* Ensure preview text respects Quill's default spacing */
        #preview-content {
            margin-top: 15px;
            padding: 10px;
            background: #fafafa;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h2>New Learning Module</h2>
    <div id="editor-container"></div>
    
    <button id="save-btn" class="btn">Save to FastAPI</button>
    <button id="preview-btn" class="btn">Preview</button>

    <!-- The Modal -->
    <div id="preview-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Content Preview</h2>
            <hr>
            <!-- Include 'ql-editor' class so Quill's CSS applies correctly to the previewed elements -->
            <div id="preview-content" class="ql-editor"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
    <script>
        // Initialize Quill (Notice there are no backslashes in the arrays here)
        const quill = new Quill('#editor-container', {
            theme: 'snow',
            modules: {
                toolbar: [
                    [{ 'font': [] }, { 'size': [] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ 'color': [] }, { 'background': [] }],
                    [{ 'header': '1' }, { 'header': '2' }, 'blockquote', 'code-block'],
                    [{ 'list': 'ordered' }, { 'list': 'bullet'}],
                    ['link', 'image', 'video'],
                    ['clean']
                ]
            }
        });

        // --- Save Functionality ---
        document.getElementById('save-btn').addEventListener('click', async () => {
            const htmlContent = quill.getSemanticHTML(); 
            
            try {
                const response = await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ html_content: htmlContent })
                });
                
                const result = await response.json();
                alert(result.message);
            } catch (error) {
                console.error("Error saving content:", error);
                alert("Failed to save content. Check if the backend is running.");
            }
        });

        // --- Modal Preview Functionality ---
        const modal = document.getElementById('preview-modal');
        const previewBtn = document.getElementById('preview-btn');
        const closeBtn = document.querySelector('.close-btn');
        const previewContent = document.getElementById('preview-content');

        // Open Modal and inject HTML
        previewBtn.addEventListener('click', () => {
            // Get the current HTML from the editor
            const htmlContent = quill.getSemanticHTML();
            
            // Set it inside the modal's content div
            previewContent.innerHTML = htmlContent;
            
            // Show the modal
            modal.style.display = 'block';
        });

        // Close Modal when clicking the 'X'
        closeBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        // Close Modal when clicking anywhere outside of the modal content
        window.addEventListener('click', (event) => {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
