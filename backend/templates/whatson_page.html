<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What's On &mdash; Metis</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <style>
    #toast-container {
      position: fixed; top: 20px; right: 20px; z-index: 9999;
      display: flex; flex-direction: column; gap: 8px;
    }
    .toast { padding: 10px 18px; border-radius: 8px; font-size: .9rem; font-weight: 500; animation: fadein .2s; }
    .toast-error { background: #fee2e2; color: #991b1b; }
    @keyframes fadein { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; } }
  </style>
</head>
<body>
  <div id="toast-container"></div>

  <div id="app">
    {% include 'sidebar.html' %}

    <div id="main-wrapper">
      {% set page_title = "AI Updates" %}
      {% include 'topbar.html' %}

      <main id="content" style="overflow-y:auto">
        <div id="whatson-container"
             hx-get="/api/events/ui"
             hx-trigger="load"
             hx-swap="outerHTML">
          <div class="loading" style="padding:24px">Loading&hellip;</div>
        </div>
      </main>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('metis_token');
    const user  = JSON.parse(localStorage.getItem('metis_user') || '{}');
    if (!token) { location.href = '/login'; }

    document.getElementById('sidebar-avatar').textContent = user.avatar_initials || '??';
    document.getElementById('topbar-avatar').textContent  = user.avatar_initials || '??';
    document.getElementById('sidebar-name').textContent   = user.full_name || user.username || '—';
    document.getElementById('sidebar-xp').textContent     = `${user.xp ?? 0} XP · Lv ${user.level ?? 0}`;
    document.getElementById('topbar-xp').textContent      = `⚡ ${user.xp ?? 0} XP`;
    if (user.is_admin) document.getElementById('admin-link').classList.remove('hidden');

    document.getElementById('admin-logout-btn').addEventListener('click', () => {
      localStorage.removeItem('metis_token');
      localStorage.removeItem('metis_user');
      location.href = '/login';
    });

    document.body.addEventListener('htmx:configRequest', evt => {
      evt.detail.headers['Authorization'] = `Bearer ${token}`;
    });

    document.body.addEventListener('htmx:responseError', () => {
      const el = document.createElement('div');
      el.className = 'toast toast-error';
      el.textContent = 'Failed to load events.';
      document.getElementById('toast-container').appendChild(el);
      setTimeout(() => el.remove(), 3500);
    });
  </script>
</body>
</html>
