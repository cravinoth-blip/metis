<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Module &mdash; Metis</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
  
  <style>
    #content { overflow-y: auto; }
    .builder-wrap { max-width: 1200px; margin: 0 auto; padding: 24px 24px 60px; }
    #split-panels { display: flex; align-items: start; gap: 0; }
    #panel-editor, #panel-preview { min-width: 200px; overflow: hidden; }
    #panel-editor  { flex: 1 1 50%; }
    #panel-preview { flex: 1 1 50%; }
    #drag-handle {
      flex: 0 0 8px; cursor: col-resize; align-self: stretch;
      display: flex; align-items: center; justify-content: center;
      margin: 0 4px;
    }
    #drag-handle::after {
      content: '';
      display: block; width: 3px; height: 48px;
      border-radius: 3px; background: var(--border, #e5e7eb);
      transition: background .15s;
    }
    #drag-handle:hover::after,
    #drag-handle.dragging::after { background: var(--primary, #6366f1); }
    .split-label { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #64748b; margin-bottom: 6px; }
    #editor-wrapper { border: 1px solid var(--border, #e5e7eb); border-radius: 8px; overflow: hidden; background: #fff; }
    #editor-container { height: 480px; }
    #live-preview {
      font-size: 14px; line-height: 1.7; color: var(--text-main, #1e293b);
    }
    #live-preview.empty::before {
      content: 'Your content will appear here as you type…';
      color: #94a3b8; font-style: italic;
    }
    #preview-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      align-items: center; justify-content: center; z-index: 1000;
    }
    #preview-overlay.open { display: flex; }
    #preview-box {
      background: #fff; border-radius: 12px; padding: 28px;
      width: 640px; max-width: 95vw; max-height: 90vh; overflow-y: auto; position: relative;
    }
    #toast-container {
      position: fixed; top: 20px; right: 20px; z-index: 9999;
      display: flex; flex-direction: column; gap: 8px;
    }
    .toast { padding: 10px 18px; border-radius: 8px; font-size: .9rem; font-weight: 500; animation: fadein .2s; }
    .toast-success { background: #dcfce7; color: #166534; }
    .toast-error   { background: #fee2e2; color: #991b1b; }
    @keyframes fadein { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; } }
  
    
        /* Fix for missing bullets in getSemanticHTML() inside .ql-editor */
    #live-preview ul, #preview-body ul {
      list-style-type: disc !important;
      padding-left: 1.5rem !important;
    }
    #live-preview ol, #preview-body ol {
      list-style-type: decimal !important;
      padding-left: 1.5rem !important;
    }
    #live-preview li, #preview-body li {
      list-style-type: inherit !important;
    }
    #live-preview ul ul, #preview-body ul ul {
      list-style-type: circle !important; /* Nested bullets */
    }

  </style>
</head>
<body>
  <div id="toast-container"></div>

  <div id="app">
    {% include 'sidebar.html' %}

    <div id="main-wrapper">
      {% set page_title = 'Edit Module' %}
      {% include 'topbar.html' %}

      <main id="content">
        <div class="builder-wrap">

          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px">
            <div>
              <h2 style="font-size:20px;margin-bottom:4px">Edit Module</h2>
              <p class="text-secondary text-sm">
                <span id="module-subtitle">Loading…</span>
                &nbsp;&mdash;&nbsp;
                <a href="/admin" style="color:var(--primary)">&#8592; Back to Admin</a>
              </p>
            </div>
            <div style="display:flex;gap:8px">
              <button id="preview-btn" class="btn btn-secondary">Preview</button>
              <button id="save-btn" class="btn btn-primary">Save Changes</button>
            </div>
          </div>

          <!-- Meta fields -->
          <div style="background:#f8fafc;padding:20px;border-radius:12px;border:1px solid var(--border);margin-bottom:24px;display:grid;grid-template-columns:2fr 1fr 1fr;gap:16px">
            <div>
              <label class="form-label" style="font-size:12px">Module Title *</label>
              <input id="mod-title" class="form-input" placeholder="e.g. Core Concepts">
            </div>
            <div>
              <label class="form-label" style="font-size:12px">Duration (min)</label>
              <input id="mod-dur" type="number" class="form-input" min="0">
            </div>
            <div>
              <label class="form-label" style="font-size:12px">XP Reward</label>
              <input id="mod-xp" type="number" class="form-input" min="0">
            </div>
          </div>

          <!-- Editor / preview split -->
          <div id="split-panels">
            <div id="panel-editor">
              <div class="split-label">Editor</div>
              <div id="editor-wrapper"><div id="editor-container"></div></div>
            </div>

            <div id="drag-handle" title="Drag to resize"></div>

            <div id="panel-preview">
              <div class="split-label">Live Preview</div>
              <div class="ql-snow" style="border:none;height:544px;overflow-y:auto;border:1px solid var(--border,#e5e7eb);border-radius:8px;">
                <div id="live-preview" class="ql-editor empty" style="height:auto;min-height:100%;border:none;"></div>
              </div>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <!-- Preview modal -->
  <div id="preview-overlay">
    <div id="preview-box">
      <button onclick="document.getElementById('preview-overlay').classList.remove('open')"
              style="position:absolute;top:12px;right:12px;background:none;border:none;font-size:1.2rem;cursor:pointer">&#10005;</button>
      <div style="display:inline-block;padding:2px 8px;border-radius:12px;background:#e2e8f0;color:#475569;font-size:11px;font-weight:700;margin-bottom:8px">PREVIEW</div>
      <h2 id="preview-title" style="font-size:22px;margin-bottom:4px"></h2>
      <div id="preview-meta" style="color:#64748b;font-size:13px;margin-bottom:20px"></div>
      <div class="ql-snow" style="border:none">
        <div id="preview-body" class="ql-editor" style="padding:0;min-height:auto;max-height:55vh;overflow-y:auto;line-height:1.7"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
  <script>
    const user      = JSON.parse(localStorage.getItem('metis_user') || '{}');
    const MODULE_ID = '{{ module_id }}';

    document.getElementById('sidebar-avatar').textContent = user.avatar_initials || '??';
    document.getElementById('topbar-avatar').textContent  = user.avatar_initials || '??';
    document.getElementById('sidebar-name').textContent   = user.full_name || user.username || '—';
    document.getElementById('sidebar-xp').textContent     = `${user.xp ?? 0} XP · Lv ${user.level ?? 0}`;
    document.getElementById('topbar-xp').textContent      = `⚡ ${user.xp ?? 0} XP`;
    if (user.is_admin) document.getElementById('admin-link').classList.remove('hidden');

    document.getElementById('admin-logout-btn').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      localStorage.removeItem('metis_user');
      location.href = '/login';
    });

    function showToast(msg, type = 'success') {
      const el = document.createElement('div');
      el.className = `toast toast-${type}`;
      el.textContent = msg;
      document.getElementById('toast-container').appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }

    // Quill
    const quill = new Quill('#editor-container', {
      theme: 'snow',
      modules: {
        toolbar: [
          [{ font: [] }, { size: ['small', false, 'large', 'huge'] }],
          [{ header: [1, 2, 3, 4, 5, 6, false] }],
          ['bold', 'italic', 'underline', 'strike'],
          [{ script: 'sub' }, { script: 'super' }],
          [{ color: [] }, { background: [] }],
          ['blockquote', 'code-block'],
          [{ list: 'ordered' }, { list: 'bullet' }, { list: 'check' }],
          [{ indent: '-1' }, { indent: '+1' }],
          [{ align: [] }],
          [{ direction: 'rtl' }],
          ['link', 'image', 'video'],
          ['clean'],
        ],
      },
    });

    const livePreview = document.getElementById('live-preview');
    quill.on('text-change', () => {
      const html = quill.getSemanticHTML();
      livePreview.innerHTML = html;
      livePreview.classList.toggle('empty', !quill.getText().trim());
    });

    // Preview modal
    document.getElementById('preview-btn').addEventListener('click', () => {
      const title = document.getElementById('mod-title').value || 'Untitled Module';
      const dur   = document.getElementById('mod-dur').value || 0;
      const xp    = document.getElementById('mod-xp').value  || 0;
      document.getElementById('preview-title').textContent = title;
      document.getElementById('preview-meta').textContent  = `⏱ ${dur} min · ${xp} XP`;
      document.getElementById('preview-body').innerHTML    = quill.getSemanticHTML()
        || '<p style="color:#64748b;text-align:center;padding:40px">Write some content to see the preview!</p>';
      document.getElementById('preview-overlay').classList.add('open');
    });

    document.getElementById('preview-overlay').addEventListener('click', e => {
      if (e.target === document.getElementById('preview-overlay'))
        document.getElementById('preview-overlay').classList.remove('open');
    });

    // Resizable split
    (function () {
      const handle   = document.getElementById('drag-handle');
      const left     = document.getElementById('panel-editor');
      const right    = document.getElementById('panel-preview');
      let dragging   = false, startX = 0, startLeftW = 0, startRightW = 0;

      handle.addEventListener('mousedown', e => {
        dragging    = true;
        startX      = e.clientX;
        startLeftW  = left.getBoundingClientRect().width;
        startRightW = right.getBoundingClientRect().width;
        handle.classList.add('dragging');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
      });
      document.addEventListener('mousemove', e => {
        if (!dragging) return;
        const dx      = e.clientX - startX;
        const totalW  = startLeftW + startRightW;
        const newLeft = Math.max(200, Math.min(totalW - 200, startLeftW + dx));
        left.style.flex  = `0 0 ${newLeft}px`;
        right.style.flex = `0 0 ${totalW - newLeft}px`;
      });
      document.addEventListener('mouseup', () => {
        if (!dragging) return;
        dragging = false;
        handle.classList.remove('dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
      });
    })();

    // Save
    document.getElementById('save-btn').addEventListener('click', async () => {
      const title = document.getElementById('mod-title').value.trim();
      if (!title) { showToast('Please enter a module title', 'error'); return; }

      const payload = {
        title,
        duration_min: parseInt(document.getElementById('mod-dur').value) || null,
        xp_reward:    parseInt(document.getElementById('mod-xp').value)  || 0,
        content_text: quill.getSemanticHTML(),
      };

      const btn = document.getElementById('save-btn');
      btn.disabled = true; btn.textContent = 'Saving…';

      try {
        const res = await fetch(`/api/admin/learning-modules/${MODULE_ID}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (!res.ok) throw new Error((await res.json()).detail || 'Save failed');
        showToast('Module updated!', 'success');
        setTimeout(() => { location.href = '/admin'; }, 800);
      } catch (e) {
        showToast(e.message, 'error');
        btn.disabled = false; btn.textContent = 'Save Changes';
      }
    });

    // Boot: load existing module data
    (async () => {
      let existing;
      try {
        const res = await fetch(`/api/admin/learning-modules/${MODULE_ID}`);
        if (!res.ok) throw new Error('Failed to load module');
        existing = await res.json();
      } catch (e) {
        showToast(e.message, 'error');
        document.getElementById('module-subtitle').textContent = 'Failed to load module';
        return;
      }

      document.getElementById('mod-title').value = existing.title      || '';
      document.getElementById('mod-dur').value   = existing.duration_min ?? '';
      document.getElementById('mod-xp').value    = existing.xp_reward  ?? 0;
      document.getElementById('module-subtitle').textContent = existing.title || MODULE_ID;

      // Load content into Quill — handle both raw HTML and legacy JSON sections
      if (existing.content_text) {
        const ct = existing.content_text.trim();
        let html = ct;
        if (ct.startsWith('[') || ct.startsWith('{')) {
          try {
            const sections = JSON.parse(ct);
            html = (Array.isArray(sections) ? sections : []).map(s => {
              const body   = s.body || '';
              const points = (s.points || []).filter(p => String(p).trim());
              if (s.type === 'heading')    return body ? `<h3>${body}</h3>` : '';
              if (s.type === 'text')       return body;
              if (s.type === 'key_points') return `<ul>${points.map(p => `<li>${p}</li>`).join('')}</ul>`;
              if (s.type === 'steps')      return `<ol>${points.map(p => `<li>${p}</li>`).join('')}</ol>`;
              if (s.type === 'tip')        return body ? `<blockquote>💡 Tip: ${body}</blockquote>` : '';
              if (s.type === 'warning')    return body ? `<blockquote>⚠ Warning: ${body}</blockquote>` : '';
              if (s.type === 'example')    return body ? `<blockquote>📋 Example: ${body}</blockquote>` : '';
              return body;
            }).join('');
          } catch (_) { html = ct; }
        }
        if (html) quill.clipboard.dangerouslyPasteHTML(html);
      }
    })();
  </script>
</body>
</html>
